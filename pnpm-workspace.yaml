  "@fontsource-variable/fredoka": ^5.3.0
  "@fontsource-variable/nunito": ^5.3.0
  "@hono/node-server": 2.1.9
  "@reduxjs/toolkit": ^2.14.0
  "@vitejs/plugin-react": ^6.3.0
  fast-check: ^4.10.2
  hono: 4.13.19
  pg: 8.23.1
  react: ^19.3.1
  react-dom: ^19.3.1
  react-redux: ^9.3.1
  react-router: ^8.5.1
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  zod: ^4.6.7
overrides:
