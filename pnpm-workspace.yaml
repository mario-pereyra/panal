  "@fontsource-variable/nunito": ^5.3.0
  "@reduxjs/toolkit": ^2.14.0
  "@vitejs/plugin-react": ^6.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-redux: ^9.3.1
  react-router: ^8.5.1
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
