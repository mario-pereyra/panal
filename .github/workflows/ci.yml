name: CI

# Corre en cada pull request y en cada cambio que llega a main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un envío nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Formato, reglas, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Las acciones se fijan por commit; el comentario dice a qué versión corresponde.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Instala Vite+ y Node, y ejecuta vp install.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true

      - name: Formato y reglas de estilo
        run: vp run check

      - name: Pruebas
        run: vp run test

      - name: Compilación
        run: vp run build
