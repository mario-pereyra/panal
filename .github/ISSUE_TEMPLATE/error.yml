name: Error
description: Algo no funciona como debería.
title: "Error: "
labels: ["bug"]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué hiciste, qué esperabas y qué ocurrió.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para repetirlo
      placeholder: |
        1. Abrir Hoy
        2. Llenar la celda "Caminar 30 minutos"
        3. La racha no cambia
    validations:
      required: true
  - type: input
    id: donde
    attributes:
      label: Dónde
      description: Navegador y dispositivo. Por ejemplo, "Chrome en Android" o "Edge en Windows".
  - type: textarea
    id: evidencia
    attributes:
      label: Capturas o mensajes de la consola
